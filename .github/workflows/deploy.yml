name: Deploy Next.js App to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e

          echo "Loading Node.js environment..."
          export NVM_DIR="$HOME/.nvm"

          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "NVM not found"
            exit 1
          fi

          . "$NVM_DIR/nvm.sh"
          nvm use 24

          echo "Checking tools..."
          node -v
          npm -v
          pm2 -v

          cd /home/deploy/static-project

          echo "Fetching latest code..."
          git fetch origin
          git reset --hard origin/main

          echo "Installing dependencies..."
          npm ci

          echo "Building Next.js application..."
          npm run build

          echo "Restarting application..."
          pm2 restart static-project --update-env
          pm2 save

          echo "Deployment completed successfully!"
          REMOTE
